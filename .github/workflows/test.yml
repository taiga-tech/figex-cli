name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  coverage-comment:
    name: Coverage Comment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run JS coverage
        run: pnpm --filter @taiga-tech/figex-cli run test:coverage

      - name: Run Rust coverage
        run: |
          cargo llvm-cov --version || cargo install cargo-llvm-cov --locked
          rustup component add llvm-tools-preview
          cargo llvm-cov --workspace --no-report
          cargo llvm-cov report \
            --ignore-filename-regex logo_assets.rs \
            --json --summary-only \
            --output-path target/rust-coverage-summary.json

      - name: Format coverage comment
        id: format
        run: |
          RUST_LINES=$(jq '.data[0].totals.lines.percent' target/rust-coverage-summary.json)
          RUST_FUNCS=$(jq '.data[0].totals.functions.percent' target/rust-coverage-summary.json)
          RUST_REGIONS=$(jq '.data[0].totals.regions.percent' target/rust-coverage-summary.json)

          JS_LINES=$(jq '.total.lines.pct' packages/cli/coverage/coverage-summary.json)
          JS_FUNCS=$(jq '.total.functions.pct' packages/cli/coverage/coverage-summary.json)
          JS_BRANCHES=$(jq '.total.branches.pct' packages/cli/coverage/coverage-summary.json)

          fmt() { printf "%.1f%%" "$1"; }

          {
            echo 'body<<__COVERAGE__'
            echo "## Coverage Report"
            echo ""
            echo "| | Lines | Functions | Branches / Regions |"
            echo "|---|---|---|---|"
            echo "| **Rust** | $(fmt $RUST_LINES) | $(fmt $RUST_FUNCS) | $(fmt $RUST_REGIONS) |"
            echo "| **TypeScript** | $(fmt $JS_LINES) | $(fmt $JS_FUNCS) | $(fmt $JS_BRANCHES) |"
            echo ""
            echo "_Commit: \`${{ github.sha }}\`_"
            echo '__COVERAGE__'
          } >> "$GITHUB_OUTPUT"

      - name: Post or update coverage comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report
          message: ${{ steps.format.outputs.body }}

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: mise run test-coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.os }}-${{ github.run_id }}
          path: |
            packages/cli/coverage
            target/rust.lcov
          if-no-files-found: warn
          retention-days: 14
